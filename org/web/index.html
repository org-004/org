<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>org</title>
<style>
/* Palette: neutral chrome, one blue ramp, and four reserved status colors.

   Progress is drawn in the blue ramp alone (not started, running, done), so it reads without
   hue: the steps were checked as an ordinal ramp in both themes. Status colors never carry
   meaning by themselves: every state has its own icon shape and a label in ink, and a milestone
   that ended partial or blocked is also named beside its bar. Green is deliberately absent from
   the bar; next to the red of a blocked segment it is lost to red-green colour blindness. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --hair: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --accent: #2a78d6; --accent-mid: #86b6ef; --accent-track: #cde2fb;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --hair: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --accent: #3987e5; --accent-mid: #1c5cab; --accent-track: #0d366b;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --hair: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --accent: #3987e5; --accent-mid: #1c5cab; --accent-track: #0d366b;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; max-width: 1480px; margin: 0 auto; padding: 20px 24px 40px; align-items: start; }
@media (max-width: 1080px) { .shell { grid-template-columns: minmax(0, 1fr); } .chat { position: static !important; height: 560px !important; } }
header.top { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; }
header.top h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
header.top .where { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; }
.ghost { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--ink-2); font-size: 12px; }
.ghost:hover { background: var(--wash); color: var(--ink); }
.ghost.danger:hover { border-color: var(--critical); }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.scroll-x { overflow-x: auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 2px 0; }
.banner { grid-column: 1 / -1; border: 1px solid var(--border); border-left: 3px solid var(--serious); background: var(--surface); border-radius: 8px; padding: 10px 14px; display: none; }
.banner.show { display: block; }

/* lead: the one headline number, and its meter */
.lead { display: grid; gap: 10px; }
.lead .row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero { font-size: 48px; font-weight: 650; line-height: 1; letter-spacing: -0.02em; }
.lead .what { font-size: 15px; color: var(--ink-2); }
.lead .reset { margin-left: auto; color: var(--ink-2); }
.meter { height: 8px; border-radius: 999px; background: var(--accent-track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); min-width: 2px; }
.meter.warning { background: color-mix(in oklab, var(--warning) 26%, var(--surface)); } .meter.warning > i { background: var(--warning); }
.meter.critical { background: color-mix(in oklab, var(--critical) 24%, var(--surface)); } .meter.critical > i { background: var(--critical); }
.meter.thin { height: 4px; margin-top: 6px; }
.lead .note { color: var(--muted); font-size: 12.5px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 12px 14px; }
.kpi .label, .stat .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 600; line-height: 1.2; }
.kpi .sub, .stat .sub { color: var(--ink-2); font-size: 12px; min-height: 17px; }

/* a run */
.run { display: grid; gap: 12px; }
.run .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run .title { font-size: 15px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.run .id { color: var(--muted); }
.run .machine { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; font-weight: 550; color: var(--ink); white-space: nowrap; background: var(--surface); }
.badge svg { width: 14px; height: 14px; flex: none; }
.r-accent { color: var(--accent); } .r-good { color: var(--good); } .r-warning { color: var(--warning); }
.r-serious { color: var(--serious); } .r-critical { color: var(--critical); } .r-muted { color: var(--muted); }
.segrow { display: flex; align-items: center; gap: 12px; }
.seg { flex: 1; display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; min-width: 80px; }
.seg > i { display: block; height: 100%; background: var(--accent-track); min-width: 6px; outline-offset: 2px; }
.seg > i.done { background: var(--accent); } .seg > i.current { background: var(--accent-mid); }
.seg > i.partial { background: var(--warning); } .seg > i.blocked { background: var(--critical); }
.segrow .count { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  flex: 0 0 auto; min-width: 250px; justify-content: flex-end; }   /* a fixed column, so the bars of every run line up */
@media (max-width: 720px) { .segrow { flex-wrap: wrap; } .segrow .seg { flex-basis: 100%; } .segrow .count { min-width: 0; justify-content: flex-start; white-space: normal; } }
.segrow .count svg { width: 13px; height: 13px; }
.lead .note svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat .value { font-size: 19px; font-weight: 600; line-height: 1.25; }
.now { display: flex; gap: 10px; align-items: baseline; border-top: 1px solid var(--hair); padding-top: 10px; min-width: 0; }
.now .k { color: var(--muted); font-size: 12px; flex: none; width: 44px; }
.now .v { min-width: 0; overflow-wrap: anywhere; }
.now .ago { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; padding-left: 8px; }
.chip { display: inline-block; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: var(--ink-2); margin-right: 6px; }
.warn { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); font-size: 13px; }
.warn svg { width: 14px; height: 14px; flex: none; margin-top: 3px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
details.ms > summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; list-style-position: inside; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms table { margin-top: 8px; }
.mstate { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.mstate svg { width: 13px; height: 13px; }
.empty { color: var(--ink-2); padding: 6px 0; }
.drafts td:last-child { text-align: right; }

/* chat */
.chat { position: sticky; top: 16px; height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.chat .hd { padding: 14px 16px 10px; border-bottom: 1px solid var(--hair); }
.chat .hd b { font-size: 14px; }
.chat .hd p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: grid; gap: 14px; align-content: start; }
.msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.msg.you .body { background: var(--wash); border-radius: 8px; padding: 7px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .err { color: var(--ink-2); border-left: 3px solid var(--critical); padding-left: 8px; }
.composer { border-top: 1px solid var(--hair); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 38px; max-height: 140px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--page); color: var(--ink); font: inherit; }
.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.primary:disabled { opacity: 0.5; cursor: default; }

/* rendered markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 16px 0 6px; line-height: 1.3; text-transform: none; letter-spacing: 0; color: var(--ink); }
.md h1 { font-size: 18px; } .md h2 { font-size: 15.5px; } .md h3 { font-size: 14px; } .md h4 { font-size: 13px; color: var(--ink-2); }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; } .md li { margin: 2px 0; }
.md pre { background: var(--wash); border-radius: 8px; padding: 10px 12px; overflow-x: auto; line-height: 1.5; }
.md code { background: var(--wash); border-radius: 4px; padding: 0 4px; } .md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--hair); color: var(--ink-2); }
.md .tw { overflow-x: auto; } .md table { width: auto; } .md th, .md td { padding-right: 16px; }
.md table.kv th { color: var(--muted); font-weight: 500; padding-right: 18px; white-space: nowrap; }
.md hr { border: 0; border-top: 1px solid var(--hair); margin: 12px 0; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.32); display: none; z-index: 20; }
.scrim.show { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); background: var(--surface); border-left: 1px solid var(--border); display: none; flex-direction: column; z-index: 21; }
.drawer.show { display: flex; }
.drawer .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.drawer .hd b { font-size: 15px; } .drawer .hd .sub { color: var(--muted); font-size: 12px; }
.drawer .hd .x { margin-left: auto; }
.drawer .bd { padding: 16px 20px 32px; overflow-y: auto; }
.approve { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; display: grid; gap: 8px; }
.approve ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.tip { position: fixed; z-index: 30; background: var(--ink); color: var(--surface); font-size: 12px; padding: 5px 8px; border-radius: 6px; pointer-events: none; display: none; max-width: 320px; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>org</h1><span class="where" id="where"></span>
    <span class="right"><span id="updated">connecting…</span><button class="ghost" id="theme" title="Switch between light, dark and the system setting">theme: auto</button></span>
  </header>
  <div class="banner" id="banner"></div>
  <main>
    <section class="card lead" id="lead" aria-label="Weekly limit"></section>
    <section class="kpis" id="kpis" aria-label="Summary"></section>
    <h2>Runs</h2>
    <div id="runs" class="stack"></div>
    <div id="draftsWrap" style="display:none"><h2 style="margin-bottom:8px">Drafts awaiting approval</h2><section class="card drafts scroll-x" id="drafts"></section></div>
  </main>
  <aside class="card chat" aria-label="Ask the manager">
    <div class="hd"><b>Ask the manager</b><p>Read-only. Answers come from the ledger and the engineers' machines; no engineer is interrupted.</p></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="q" rows="1" placeholder="What is the export run doing?" aria-label="Question for the manager"></textarea>
      <button class="primary" id="send" type="submit">Ask</button>
    </form>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="hd"><div><b id="drawerTitle"></b><div class="sub" id="drawerSub"></div></div><button class="ghost x" id="drawerClose">Close</button></div>
  <div class="bd" id="drawerBody"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
// ---------------------------------------------------------------- small helpers
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function dur(s) {
  if (s == null) return "—";
  s = Math.max(0, Math.floor(s));
  if (s < 60) return s + "s";
  let m = Math.floor(s / 60); s %= 60;
  if (m < 60) return m >= 10 ? m + "m" : m + "m" + String(s).padStart(2, "0") + "s";
  let h = Math.floor(m / 60); m %= 60;
  if (h < 24) return h + "h" + String(m).padStart(2, "0") + "m";
  return Math.floor(h / 24) + "d" + (h % 24) + "h";
}
function usd(x) { return x == null ? "—" : "$" + (x < 100 ? x.toFixed(2) : Math.round(x).toLocaleString()); }
function clock(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000), n = new Date();
  const hm = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false});
  if (d.toDateString() === n.toDateString()) return hm;
  if (Math.abs(d - n) < 6 * 86400e3) return d.toLocaleDateString([], {weekday: "short"}) + " " + hm;
  return d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + hm;
}
const nowS = () => Date.now() / 1000;
function rel(ts) { if (!ts) return ""; const d = ts - nowS(); return d >= 0 ? "in " + dur(d) : dur(-d) + " ago"; }

// ---------------------------------------------------------------- icons: one shape per meaning
const ICON = {
  dot: '<circle cx="7" cy="7" r="5" fill="currentColor"/>',
  check: '<circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4 7.2l2.1 2.1L10 5.2" fill="none" stroke="var(--surface)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  cross: '<circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M4.7 4.7l4.6 4.6M9.3 4.7l-4.6 4.6" fill="none" stroke="var(--surface)" stroke-width="1.7" stroke-linecap="round"/>',
  half: '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 1.4a5.6 5.6 0 000 11.2z" fill="currentColor"/>',
  pause: '<rect x="3" y="2.5" width="3" height="9" rx="1" fill="currentColor"/><rect x="8" y="2.5" width="3" height="9" rx="1" fill="currentColor"/>',
  square: '<rect x="2.5" y="2.5" width="9" height="9" rx="2" fill="currentColor"/>',
  alert: '<path d="M7 1.2l6.2 11.3H.8z" fill="currentColor"/><path d="M7 5.4v3.3" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.6" r=".9" fill="var(--surface)"/>',
  ring: '<circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
};
const icon = (name, role) => '<svg viewBox="0 0 14 14" class="r-' + role + '" aria-hidden="true">' + ICON[name] + "</svg>";
const STATE = {
  queued: ["muted", "ring", "Queued"],
  provisioning: ["accent", "dot", "Provisioning"], dispatched: ["accent", "dot", "Starting"],
  planning: ["accent", "dot", "Planning"], executing: ["accent", "dot", "Executing"], reporting: ["accent", "dot", "Reporting"],
  waiting: ["warning", "pause", "Waiting for the limit"],
  done: ["good", "check", "Done"], partial: ["warning", "half", "Partial"],
  failed: ["critical", "cross", "Failed"], dispatch_failed: ["critical", "cross", "Dispatch failed"],
  stopped: ["muted", "square", "Stopped"],
};
const HEALTH = {unreachable: "machine unreachable", stalled: "no heartbeat", dead: "runner died"};
const MSTATE = {done: ["good", "check", "done"], partial: ["warning", "half", "partial"], blocked: ["critical", "cross", "blocked"],
                current: ["accent", "dot", "running"], pending: ["muted", "ring", "not started"]};
function badge(v) {
  const s = STATE[v.state] || ["muted", "ring", v.state];
  let out = '<span class="badge">' + icon(s[1], s[0]) + esc(s[2]) + "</span>";
  if (HEALTH[v.health]) out += ' <span class="badge">' + icon("alert", "serious") + esc(HEALTH[v.health]) + "</span>";
  return out;
}

// ---------------------------------------------------------------- markdown, small and safe
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s.replace(/\u0001(\d+)\u0001/g, (m, i) => "<code>" + codes[+i] + "</code>");
}
function md(src) {
  const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  if (lines[0] === "---") {                       // a spec's header: show it as a small table
    let j = 1; const rows = [];
    while (j < lines.length && lines[j] !== "---") { const k = lines[j].indexOf(":"); if (k > 0) rows.push([lines[j].slice(0, k).trim(), lines[j].slice(k + 1).trim()]); j++; }
    if (j < lines.length) {
      out.push('<table class="kv">' + rows.filter(r => r[1]).map(r => "<tr><th>" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td></tr>").join("") + "</table>");
      i = j + 1;
    }
  }
  const isBlock = l => /^(#{1,6}\s|```|\s*([-*]|\d+\.)\s|>|\s*$)/.test(l);
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { const n = Math.min(m[1].length, 4); out.push("<h" + n + ">" + inline(m[2]) + "</h" + n + ">"); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(lines[i + 1])) {
      const head = cells(line); i += 2; const body = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) body.push(cells(lines[i++]));
      out.push('<div class="tw"><table><thead><tr>' + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>"
        + body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>");
      continue;
    }
    if ((m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line))) {
      const ordered = /\d/.test(m[2]); const items = [];
      while (i < lines.length) {
        const mm = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (mm) { items.push([Math.floor(mm[1].length / 2), mm[3]]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1][1] += " " + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map(([depth, text]) => {
        const t = text.replace(/^\[ \]\s*/, "☐ ").replace(/^\[[xX]\]\s*/, "☑ ");
        return "<li" + (depth ? ' style="margin-left:' + depth * 18 + 'px"' : "") + ">" + inline(t) + "</li>";
      }).join("") + "</" + tag + ">");
      continue;
    }
    if (/^>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inline(buf.join(" ")) + "</blockquote>"); continue;
    }
    const buf = [line]; i++;
    while (i < lines.length && !isBlock(lines[i])) buf.push(lines[i++]);
    out.push("<p>" + inline(buf.join(" ")) + "</p>");
  }
  return out.join("\n");
}

      buf += dec.decode(value, {stream: true});
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, k); buf = buf.slice(k + 2);
        if (!frame.startsWith("data: ")) continue;
        const ev = JSON.parse(frame.slice(6));
        if (ev.t) { text += ev.t; renderChat(text); }
        if (ev.done) done = ev;
      }
    }
    chat.push({role: "manager", text: (done && done.text) || text, cost: done ? done.cost_usd : null, error: done && done.error && done.error !== text.trim() ? done.error : null});
  } catch (e) { chat.push({role: "manager", text: text, error: e.message}); }
  saveChat(); asking = false; $("send").disabled = false; renderChat(); $("q").focus();
}
$("composer").addEventListener("submit", ev => { ev.preventDefault(); const q = $("q").value; $("q").value = ""; $("q").style.height = ""; ask(q); });
$("q").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("composer").requestSubmit(); } });
$("q").addEventListener("input", ev => { ev.target.style.height = ""; ev.target.style.height = Math.min(ev.target.scrollHeight, 140) + "px"; });

// ---------------------------------------------------------------- theme, and go
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); $("theme").textContent = "theme: " + t; }
let theme = "auto"; try { theme = localStorage.getItem("org-theme") || "auto"; } catch (e) {}
applyTheme(theme);
$("theme").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem("org-theme", theme); } catch (e) {} applyTheme(theme); };
renderChat(); load();
setInterval(load, 5000);
setInterval(() => { if (state && !document.hidden) render(); }, 1000);   // keeps elapsed times and "ago" moving between polls
</script>
